<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서준엄마네</title>
<meta name="description" content="가족들이 먹는다는 마음으로 검증한 제품만 판매합니다. 서준엄마네 추천 상품과 카테고리를 한눈에 보고 스마트스토어에서 구매하세요.">
<meta property="og:title" content="서준엄마네">
<meta property="og:description" content="우리는 싸서 판매하지 않습니다. 검증해서 판매합니다.">
<meta property="og:image" content="assets/brand/logo-vertical.png">
<meta name="theme-color" content="#FF850D">
<link rel="icon" href="assets/brand/symbol.png" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/symbol.png">
<style>
/* ---------- 서체 (assets/fonts, OFL) ---------- */
@font-face{
  font-family:"Jiugae";
  src:url("assets/fonts/HakgyoansimJiugae.woff2") format("woff2");
  font-weight:400;font-display:swap;
}
@font-face{
  font-family:"Pretendard";
  src:url("assets/fonts/PretendardVariable.woff2") format("woff2-variations");
  font-weight:45 920;font-display:swap;
}

/* ---------- 브랜드 토큰 (서준엄마네 가이드라인) ---------- */
:root{
  --tangerine:#FF850D;      /* Main · Warm Tangerine */
  --tangerine-deep:#E0700A; /* 눌렀을 때 */
  --tangerine-40:#FFCE9E;   /* 명도 변형 40% */
  --tangerine-12:#FFF1E3;   /* 명도 변형 12% */
  --black:#232323;          /* Seojun Mom Black */
  --gray:#C8C8C6;           /* Seojun Mom Gray */
  --gray-text:#7A7772;
  --white:#FFFFFF;
  --line:#EEE7DF;
  --ground:#FBF3EA;         /* 데스크탑에서 폰 화면 바깥 바닥 */
  --display:"Jiugae","Pretendard",system-ui,sans-serif;
  --body:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --radius:14px;
  --gutter:20px;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--black);
  font-family:var(--body);font-weight:500;font-size:15px;line-height:1.55;
  word-break:keep-all;overflow-wrap:anywhere;
}
img{display:block;max-width:100%}
.gallery li,.products li,.cats li{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit}
:focus-visible{outline:3px solid var(--tangerine);outline-offset:2px}

/* 폰 화면 폭 고정: 모바일에선 전체, 데스크탑에선 가운데 480px */
.phone{max-width:480px;margin:0 auto;background:var(--white);min-height:100dvh;
  box-shadow:0 0 0 1px var(--line)}
@media (min-width:520px){.phone{margin-block:24px;border-radius:28px;overflow:hidden}}

/* ---------- 상단 바 ---------- */
.top{
  position:sticky;top:0;z-index:5;background:var(--white);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px var(--gutter);border-bottom:1px solid var(--line);
}
.top img{height:34px;width:auto}
.top .store-link{
  font-size:13px;font-weight:700;color:var(--tangerine);
  padding:8px 12px;border:1.5px solid var(--tangerine);border-radius:999px;
}

/* ---------- 메인 배너 ---------- */
.hero{position:relative}
.hero .photo{aspect-ratio:4/3;width:100%;object-fit:cover}
.hero .thesis{
  background:var(--tangerine);color:var(--white);
  padding:28px var(--gutter) 30px;
}
.hero h1{
  font-family:var(--display);font-weight:400;
  font-size:31px;line-height:1.25;margin:0 0 14px;letter-spacing:-.01em;
  text-wrap:balance;white-space:pre-line;
}
.hero p{margin:0;font-size:15px;line-height:1.6;opacity:.95;white-space:pre-line}

/* ---------- 공통 섹션 ---------- */
.section{padding:36px var(--gutter) 8px}
.section + .section{padding-top:28px}
.section h2{
  font-family:var(--display);font-weight:400;
  font-size:26px;line-height:1.2;margin:0 0 6px;color:var(--black);
}
.section .lead{margin:0 0 18px;color:var(--gray-text);font-size:14px}

/* ---------- 검증 프로세스 (순서가 있는 내용이라 번호를 씁니다) ---------- */
.steps{list-style:none;margin:0;padding:0;counter-reset:step}
.steps li{
  position:relative;display:grid;grid-template-columns:40px 1fr;column-gap:14px;
  padding-block:12px;
}
.steps li::before{
  counter-increment:step;content:counter(step);
  font-family:var(--display);font-size:20px;line-height:40px;text-align:center;
  width:40px;height:40px;border-radius:50%;
  background:var(--tangerine);color:var(--white);
}
.steps li + li::after{
  content:"";position:absolute;left:19px;top:-8px;height:20px;
  border-left:2px dashed var(--tangerine-40);
}
.steps li:last-child::before{background:var(--black)}
.steps strong{display:block;font-size:17px;font-weight:800;margin:6px 0 2px}
.steps span{color:var(--gray-text);font-size:14px}

/* ---------- 검증 현장 사진 ---------- */
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.gallery figure{margin:0}
.gallery img{aspect-ratio:1;object-fit:cover;width:100%;border-radius:var(--radius);background:var(--tangerine-12)}
.gallery figcaption{font-size:13px;color:var(--gray-text);margin-top:6px}
.gallery li:first-child{grid-column:1/-1}
.gallery li:first-child img{aspect-ratio:3/2}

/* ---------- 추천 상품 ---------- */
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;margin:0;padding:0;list-style:none}
.card{display:block;-webkit-tap-highlight-color:transparent}
.card img{aspect-ratio:1;width:100%;object-fit:cover;border-radius:var(--radius);background:var(--tangerine-12)}
.card .cat{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;color:var(--tangerine);
  padding:2px 8px;border-radius:999px;background:var(--tangerine-12)}
.card .name{display:block;font-size:15px;font-weight:700;line-height:1.35;margin-top:6px}
.card .note{display:block;font-size:12px;color:var(--gray-text);margin-top:2px}
.card .price{display:block;font-size:18px;font-weight:800;margin-top:6px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card .price small{font-size:13px;font-weight:600;margin-left:1px}
.card .go{
  display:flex;align-items:center;justify-content:center;
  height:40px;margin-top:8px;border-radius:10px;
  background:var(--tangerine);color:var(--white);font-size:13px;font-weight:700;
}
.card:active .go{background:var(--tangerine-deep)}

/* ---------- 카테고리 ---------- */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.cats a{
  display:block;padding:16px 16px 14px;border-radius:var(--radius);
  background:var(--tangerine-12);border:1.5px solid transparent;min-height:84px;
}
.cats a:active{border-color:var(--tangerine)}
.cats .cname{display:block;font-family:var(--display);font-size:22px;line-height:1.1;color:var(--tangerine)}
.cats .cdesc{display:block;font-size:12px;color:var(--gray-text);margin-top:6px}
.cats li.all{grid-column:1/-1}
.cats li.all a{background:var(--black);text-align:center;min-height:0;padding-block:18px}
.cats li.all .cname{color:var(--white)}
.cats li.all .cdesc{color:var(--gray)}

/* ---------- 하단 ---------- */
.footer{margin-top:36px;padding:28px var(--gutter) 40px;background:var(--tangerine-12)}
.footer .logo{width:120px;margin:0 auto 22px}
.footer .actions{display:grid;gap:10px}
.footer .actions a{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:52px;border-radius:12px;font-size:15px;font-weight:700;
  background:var(--white);border:1.5px solid var(--gray);
}
.footer .actions a.primary{background:var(--tangerine);border-color:var(--tangerine);color:var(--white)}
.footer .actions svg{width:20px;height:20px;flex:none}
.footer .info{margin:22px 0 0;font-size:12px;line-height:1.7;color:var(--gray-text);text-align:center}
.footer .info b{color:var(--black);font-weight:700}

@media (prefers-reduced-motion:no-preference){
  .card .go,.cats a{transition:background-color .15s,border-color .15s}
}
</style>
</head>
<body>
<div class="phone">

  <header class="top">
    <a href="#top" aria-label="서준엄마네 홈">
      <img src="assets/brand/logo-horizontal.png" alt="서준엄마네 SEOJUNMOM STORE">
    </a>
    <a class="store-link" id="top-store" href="#" target="_blank" rel="noopener">스마트스토어</a>
  </header>

  <section class="hero" id="top">
    <img class="photo" id="hero-img" src="" alt="">
    <div class="thesis">
      <h1 id="hero-h1"></h1>
      <p id="hero-sub"></p>
    </div>
  </section>

  <section class="section" aria-labelledby="h-process">
    <h2 id="h-process">이렇게 검증합니다</h2>
    <p class="lead">다섯 단계를 모두 통과한 제품만 올립니다.</p>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="section" aria-labelledby="h-gallery">
    <h2 id="h-gallery">실제 검증 현장</h2>
    <p class="lead">제조사 방문, 조리 테스트, 창고까지 직접 확인합니다.</p>
    <ul class="gallery" id="gallery"></ul>
  </section>

  <section class="section" aria-labelledby="h-products">
    <h2 id="h-products">추천 상품</h2>
    <p class="lead">상품을 누르면 스마트스토어 상품 페이지로 이동합니다.</p>
    <ul class="products" id="products"></ul>
  </section>

  <section class="section" aria-labelledby="h-cats">
    <h2 id="h-cats">카테고리</h2>
    <p class="lead">원하는 종류를 골라 바로 둘러보세요.</p>
    <ul class="cats" id="cats"></ul>
  </section>

  <footer class="footer">
    <img class="logo" src="assets/brand/logo-vertical.png" alt="서준엄마네">
    <div class="actions" id="actions"></div>
    <p class="info" id="info"></p>
  </footer>

</div>

<script src="data.js"></script>
<script>
(function(){
  var S = window.SITE || {};
  function el(tag, attrs, children){
    var n = document.createElement(tag);
    for (var k in (attrs||{})) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c) n.appendChild(c); });
    return n;
  }
  function won(n){ return Number(n).toLocaleString('ko-KR'); }
  function ext(a){ a.setAttribute('target','_blank'); a.setAttribute('rel','noopener'); return a; }

  /* 상단 스토어 버튼 */
  document.getElementById('top-store').href = (S.store && S.store.main) || '#';

  /* 메인 배너 */
  if (S.hero) {
    var hi = document.getElementById('hero-img');
    hi.src = S.hero.image; hi.alt = S.hero.imageAlt || '';
    document.getElementById('hero-h1').textContent = S.hero.headline || '';
    document.getElementById('hero-sub').textContent = S.hero.sub || '';
  }

  /* 검증 프로세스 */
  var steps = document.getElementById('steps');
  (S.process||[]).forEach(function(p){
    steps.appendChild(el('li', null, [
      el('div', null, [ el('strong',{text:p.title}), el('span',{text:p.desc}) ])
    ]));
  });

  /* 현장 사진 */
  var g = document.getElementById('gallery');
  (S.gallery||[]).forEach(function(ph){
    g.appendChild(el('li', null, [
      el('figure', null, [
        el('img',{src:ph.image, alt:ph.caption, loading:'lazy'}),
        el('figcaption',{text:ph.caption})
      ])
    ]));
  });

  /* 추천 상품 */
  var pl = document.getElementById('products');
  (S.products||[]).forEach(function(p){
    var a = ext(el('a',{class:'card', href:p.url, 'aria-label': p.name + ' 스마트스토어에서 보기'}, [
      el('img',{src:p.image, alt:'', loading:'lazy'}),
      el('span',{class:'cat', text:p.category}),
      el('span',{class:'name', text:p.name}),
      p.note ? el('span',{class:'note', text:p.note}) : null,
      el('span',{class:'price', html: won(p.price) + '<small>원</small>'}),
      el('span',{class:'go', text:'스마트스토어에서 구매'})
    ]));
    pl.appendChild(el('li', null, [a]));
  });

  /* 카테고리 */
  var cl = document.getElementById('cats');
  (S.categories||[]).forEach(function(c){
    cl.appendChild(el('li', null, [
      ext(el('a',{href:c.url}, [ el('span',{class:'cname',text:c.name}), el('span',{class:'cdesc',text:c.desc||''}) ]))
    ]));
  });
  cl.appendChild(el('li',{class:'all'}, [
    ext(el('a',{href:(S.store && (S.store.all || S.store.main)) || '#'}, [
      el('span',{class:'cname',text:'전체보기'}),
      el('span',{class:'cdesc',text:'스마트스토어 전체 상품'})
    ]))
  ]));

  /* 하단 버튼 */
  var C = S.contact || {};
  var ac = document.getElementById('actions');
  var igIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';
  var telIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
  var bagIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';
  ac.appendChild(ext(el('a',{class:'primary', href:(S.store && S.store.main) || '#', html: bagIcon + '<span>스마트스토어 전체보기</span>'})));
  if (C.instagram) ac.appendChild(ext(el('a',{href:C.instagram, html: igIcon + '<span>인스타그램</span>'})));
  if (C.phone) ac.appendChild(el('a',{href:'tel:' + C.phone.replace(/[^0-9+]/g,''), html: telIcon + '<span>고객센터 ' + C.phone + '</span>'}));

  var info = document.getElementById('info');
  var lines = [];
  if (C.hours) lines.push('<b>고객센터</b> ' + C.hours);
  if (C.company) lines.push(C.company + (C.business ? ' · ' + C.business : ''));
  if (C.address) lines.push(C.address);
  info.innerHTML = lines.join('<br>');
})();
</script>
</body>
</html>
