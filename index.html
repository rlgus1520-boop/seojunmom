<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서준엄마네</title>
<meta name="description" content="맛있게 드시기만 하세요. 검증은 서준엄마네가 하겠습니다. 검증된 제품과 카테고리를 한눈에 보고 스마트스토어에서 구매하세요.">
<meta property="og:title" content="서준엄마네">
<meta property="og:description" content="맛있게 드시기만 하세요. 검증은 저희가 하겠습니다.">
<meta property="og:image" content="assets/brand/logo-vertical.png">
<meta name="theme-color" content="#FF850D">
<link rel="icon" href="assets/brand/symbol.png" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/symbol.png">
<style>
/* ---------- 서체: Pretendard 단일 (OFL), 자간 -20 ---------- */
@font-face{
  font-family:"Pretendard";
  src:url("assets/fonts/PretendardVariable.woff2") format("woff2-variations");
  font-weight:45 920;font-display:swap;
}

/* ---------- 브랜드 토큰 (서준엄마네 가이드라인) ---------- */
:root{
  --tangerine:#FF850D;      /* Main · Warm Tangerine */
  --tangerine-deep:#E86F00;
  --tangerine-40:#FFCE9E;
  --tangerine-12:#FFF1E3;
  --tangerine-6:#FFF8F1;
  --black:#232323;          /* Seojun Mom Black */
  --gray:#C8C8C6;           /* Seojun Mom Gray */
  --gray-text:#7A7772;
  --gray-strike:#A9A5A0;
  --white:#FFFFFF;
  --line:#EEE7DF;
  --ground:#FBF3EA;
  --body:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --radius:14px;
  --gutter:20px;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--black);
  font-family:var(--body);font-weight:500;font-size:15px;line-height:1.55;
  letter-spacing:-0.02em;            /* 자간 -20 */
  word-break:keep-all;overflow-wrap:anywhere;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--tangerine);outline-offset:2px}
.gallery li,.products li,.cats li{min-width:0}

/* 폰 화면 폭: 모바일에선 전체, 데스크탑에선 가운데 480px */
.phone{max-width:480px;margin:0 auto;background:var(--white);min-height:100dvh;
  box-shadow:0 0 0 1px var(--line)}
@media (min-width:520px){.phone{margin-block:24px;border-radius:28px;overflow:hidden}}

/* ---------- 상단 바: 로고 중앙 정렬 (기존 1.5배) ---------- */
.top{
  position:sticky;top:0;z-index:5;background:var(--white);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:10px var(--gutter);border-bottom:1px solid var(--line);
}
.top .logo-link{grid-column:2;display:block}
.top img{height:51px;width:auto}
.top .store-link{
  grid-column:3;justify-self:end;
  font-size:13px;font-weight:700;color:var(--tangerine);
  padding:8px 12px;border:1.5px solid var(--tangerine);border-radius:999px;
}

/* ---------- 메인 배너: 사진 비율(780x474) 그대로, 왼쪽 문구 고정 + 사진 자동 교체 ---------- */
.hero{
  position:relative;width:100%;aspect-ratio:780/474;overflow:hidden;background:var(--tangerine-12);
  container-type:inline-size;
}
.hero .slides{position:absolute;inset:0}
.hero .slides img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .7s ease;
}
.hero .slides img.is-active{opacity:1}
.hero .copy{
  position:absolute;left:5.5cqw;right:30%;top:50%;transform:translateY(-50%);
}
.hero h1{
  margin:0 0 3cqw;font-size:4.9cqw;line-height:1.3;font-weight:800;
  letter-spacing:-0.03em;white-space:pre-line;
}
.hero .sub{
  margin:0;font-size:3.2cqw;line-height:1.55;font-weight:600;color:var(--black);
  letter-spacing:-0.02em;white-space:pre-line;
}
.hero .dots{
  position:absolute;left:0;right:0;bottom:3cqw;display:flex;justify-content:center;gap:6px;margin:0;padding:0;list-style:none;
}
.hero .dots button{
  width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--gray);cursor:pointer;
}
.hero .dots button.is-active{background:var(--tangerine);width:18px;border-radius:4px}

/* ---------- 공통 섹션 제목: 번호만 굵고 주황 ---------- */
.section{padding:30px var(--gutter) 8px}
.section + .section{padding-top:26px}
.section h2{
  display:flex;align-items:baseline;gap:8px;
  font-size:20px;line-height:1.2;font-weight:700;margin:0 0 16px;color:var(--black);
}
.section h2 .num{font-size:23px;font-weight:900;color:var(--tangerine);letter-spacing:-0.03em}

/* ---------- 01 검증된 제품: 할인 전 가격 + 특별가 ---------- */
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;margin:0;padding:0;list-style:none}
.card{display:block;-webkit-tap-highlight-color:transparent;container-type:inline-size}
.card img{aspect-ratio:1;width:100%;object-fit:cover;border-radius:var(--radius);background:var(--tangerine-12)}
.card .cat{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;color:var(--tangerine);
  padding:2px 8px;border-radius:999px;background:var(--tangerine-12)}
.card .name{display:block;font-size:14px;font-weight:700;line-height:1.35;margin-top:6px}
.card .note{display:block;font-size:12px;color:var(--gray-text);margin-top:3px;line-height:1.4}
.card .pricing{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin-top:6px;
  font-variant-numeric:tabular-nums}
.card .was{font-size:13px;font-weight:500;color:var(--gray-strike);text-decoration:line-through}
.card .tag{font-size:13px;font-weight:800;color:var(--tangerine)}
.card .price{font-size:18px;font-weight:800}
.card .price small{font-size:13px;font-weight:600}
@container (max-width:185px){.card .was{flex-basis:100%;line-height:1.3}}
.card .go{
  display:flex;align-items:center;justify-content:center;
  height:40px;margin-top:8px;border-radius:10px;
  background:var(--tangerine);color:var(--white);font-size:13px;font-weight:700;
}
.card:active .go{background:var(--tangerine-deep)}

/* ---------- 02 실제 검증 현장: 가로 스크롤 ---------- */
.gallery-wrap{position:relative;margin-inline:calc(var(--gutter) * -1)}
.gallery{
  display:flex;gap:12px;margin:0;padding:0 var(--gutter);list-style:none;
  overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.gallery::-webkit-scrollbar{display:none}
.gallery li{flex:0 0 74%;scroll-snap-align:start}
.gallery figure{margin:0}
.gallery img{aspect-ratio:5/4;width:100%;object-fit:cover;border-radius:16px;background:var(--tangerine-12)}
.gallery figcaption{font-size:13px;font-weight:600;color:var(--tangerine);text-align:center;margin-top:8px}
.gallery-wrap .arrow{
  position:absolute;top:calc(37% - 16px);width:32px;height:32px;border-radius:50%;border:0;
  background:var(--tangerine);color:var(--white);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(35,35,35,.18);cursor:pointer;z-index:2;
}
.gallery-wrap .arrow svg{width:14px;height:14px}
.gallery-wrap .arrow.prev{left:6px}
.gallery-wrap .arrow.next{right:6px}
.gallery-wrap .arrow:disabled{opacity:.35;cursor:default}
.gallery-track{
  position:relative;height:4px;border-radius:2px;background:var(--line);
  margin:14px var(--gutter) 0;overflow:hidden;
}
.gallery-track .thumb{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:2px;background:var(--tangerine)}

/* ---------- 03 카테고리: 이미지 아이콘 3열 카드 ---------- */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.cats a{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:10px 8px 12px;border-radius:16px;
  background:var(--white);border:1px solid var(--line);
  box-shadow:0 1px 4px rgba(35,35,35,.05);
}
.cats a:active{border-color:var(--tangerine)}
.cats .ico{
  width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--tangerine-6);
}
.cats .ico img{width:100%;height:100%;object-fit:cover}
.cats .cname{display:block;font-size:15px;font-weight:800;line-height:1.2;margin-top:10px}
.cats .cgo{display:block;font-size:12px;color:var(--gray-text);margin-top:3px}
.all-btn{
  display:flex;align-items:center;justify-content:center;
  height:52px;margin-top:16px;border-radius:14px;
  background:linear-gradient(90deg,var(--tangerine),var(--tangerine-deep));
  color:var(--white);font-size:16px;font-weight:800;
}
.all-btn:active{filter:brightness(.95)}

/* ---------- 하단: 로고 + 고객센터 ---------- */
.footer{margin-top:36px;padding:28px var(--gutter) 40px;background:var(--tangerine-12)}
.footer .logo{width:120px;margin:0 auto 22px}
.footer .actions{display:grid;gap:10px}
.footer .actions a{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:52px;border-radius:12px;font-size:15px;font-weight:700;
  background:var(--white);border:1.5px solid var(--gray);
}
.footer .actions svg{width:20px;height:20px;flex:none}
.footer .info{margin:20px 0 0;font-size:12px;line-height:1.7;color:var(--gray-text);text-align:center}
.footer .info b{color:var(--black);font-weight:700}

@media (prefers-reduced-motion:reduce){
  .hero .slides img{transition:none}
}
</style>
</head>
<body>
<div class="phone">

  <header class="top">
    <a class="logo-link" href="#top" aria-label="서준엄마네 홈">
      <img src="assets/brand/logo-horizontal.png" alt="서준엄마네 SEOJUNMOM STORE">
    </a>
    <a class="store-link" id="top-store" href="#" target="_blank" rel="noopener">스마트스토어</a>
  </header>

  <section class="hero" id="top" aria-roledescription="carousel" aria-label="대표 음식 사진">
    <div class="slides" id="slides"></div>
    <div class="copy">
      <h1 id="hero-h1"></h1>
      <p class="sub" id="hero-sub"></p>
    </div>
    <ul class="dots" id="dots"></ul>
  </section>

  <section class="section" aria-labelledby="h-products">
    <h2 id="h-products"><span class="num">01</span>검증된 제품 보러가기</h2>
    <ul class="products" id="products"></ul>
  </section>

  <section class="section" aria-labelledby="h-gallery">
    <h2 id="h-gallery"><span class="num">02</span>실제 검증 현장</h2>
    <div class="gallery-wrap">
      <button class="arrow prev" id="g-prev" type="button" aria-label="이전 사진">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <ul class="gallery" id="gallery"></ul>
      <button class="arrow next" id="g-next" type="button" aria-label="다음 사진">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="gallery-track" aria-hidden="true"><div class="thumb" id="g-thumb"></div></div>
  </section>

  <section class="section" aria-labelledby="h-cats">
    <h2 id="h-cats"><span class="num">03</span>카테고리</h2>
    <ul class="cats" id="cats"></ul>
    <a class="all-btn" id="all-btn" href="#" target="_blank" rel="noopener">전체 상품 보러가기</a>
  </section>

  <footer class="footer">
    <img class="logo" src="assets/brand/logo-vertical.png" alt="서준엄마네">
    <div class="actions" id="actions"></div>
    <p class="info" id="info"></p>
  </footer>

</div>

<script src="data.js"></script>
<script>
(function(){
  var S = window.SITE || {};
  function el(tag, attrs, children){
    var n = document.createElement(tag);
    for (var k in (attrs||{})) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c) n.appendChild(c); });
    return n;
  }
  function won(n){ return Number(n).toLocaleString('ko-KR'); }
  function ext(a){ a.setAttribute('target','_blank'); a.setAttribute('rel','noopener'); return a; }
  var storeMain = (S.store && S.store.main) || '#';
  var storeAll  = (S.store && (S.store.all || S.store.main)) || '#';

  document.getElementById('top-store').href = storeMain;
  document.getElementById('all-btn').href = storeAll;

  /* ---------- 메인 배너 ---------- */
  var H = S.hero || {};
  document.getElementById('hero-h1').textContent = H.headline || '';
  document.getElementById('hero-sub').textContent = H.sub || '';
  var slidesBox = document.getElementById('slides');
  var dotsBox = document.getElementById('dots');
  var imgs = H.images || [];
  var slides = imgs.map(function(im, i){
    var img = el('img', {src: im.src, alt: im.alt || '', 'aria-hidden': i ? 'true' : 'false'});
    if (i === 0) img.className = 'is-active';
    slidesBox.appendChild(img);
    return img;
  });
  var dots = imgs.map(function(im, i){
    var b = el('button', {type:'button', 'aria-label': (i+1) + '번째 사진'});
    if (i === 0) b.className = 'is-active';
    b.addEventListener('click', function(){ show(i); restart(); });
    dotsBox.appendChild(el('li', null, [b]));
    return b;
  });
  var cur = 0, timer = null;
  function show(i){
    if (!slides.length) return;
    slides[cur].className = ''; dots[cur].className = '';
    slides[cur].setAttribute('aria-hidden','true');
    cur = (i + slides.length) % slides.length;
    slides[cur].className = 'is-active'; dots[cur].className = 'is-active';
    slides[cur].setAttribute('aria-hidden','false');
  }
  function restart(){
    if (timer) clearInterval(timer);
    if (slides.length > 1) timer = setInterval(function(){ show(cur + 1); }, H.interval || 2000);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) { clearInterval(timer); timer = null; } else restart();
  });
  restart();

  /* ---------- 01 검증된 제품 ---------- */
  var pl = document.getElementById('products');
  (S.products||[]).forEach(function(p){
    var pricing = el('span',{class:'pricing'});
    if (p.originalPrice && Number(p.originalPrice) > Number(p.price)) {
      pricing.appendChild(el('span',{class:'was', text: won(p.originalPrice) + '원'}));
      pricing.appendChild(el('span',{class:'tag', text:'특별가'}));
    }
    pricing.appendChild(el('span',{class:'price', html: won(p.price) + '<small>원</small>'}));
    var a = ext(el('a',{class:'card', href:p.url, 'aria-label': p.name + ' 특가 구매하기'}, [
      el('img',{src:p.image, alt:'', loading:'lazy'}),
      p.category ? el('span',{class:'cat', text:p.category}) : null,
      el('span',{class:'name', text:p.name}),
      p.note ? el('span',{class:'note', text:p.note}) : null,
      pricing,
      el('span',{class:'go', text:'특가 구매하기'})
    ]));
    pl.appendChild(el('li', null, [a]));
  });

  /* ---------- 02 현장 사진 (가로 스크롤) ---------- */
  var g = document.getElementById('gallery');
  (S.gallery||[]).forEach(function(ph){
    g.appendChild(el('li', null, [
      el('figure', null, [
        el('img',{src:ph.image, alt:ph.caption, loading:'lazy'}),
        el('figcaption',{text:ph.caption})
      ])
    ]));
  });
  var prev = document.getElementById('g-prev'), next = document.getElementById('g-next'), thumb = document.getElementById('g-thumb');
  function stepW(){ var li = g.querySelector('li'); return li ? li.getBoundingClientRect().width + 12 : 200; }
  function syncBar(){
    var max = g.scrollWidth - g.clientWidth;
    var ratio = g.clientWidth / g.scrollWidth;
    thumb.style.width = Math.max(ratio * 100, 12) + '%';
    thumb.style.left = (max > 0 ? (g.scrollLeft / max) * (100 - Math.max(ratio * 100, 12)) : 0) + '%';
    prev.disabled = g.scrollLeft <= 2;
    next.disabled = g.scrollLeft >= max - 2;
  }
  prev.addEventListener('click', function(){ g.scrollBy({left: -stepW(), behavior:'smooth'}); });
  next.addEventListener('click', function(){ g.scrollBy({left:  stepW(), behavior:'smooth'}); });
  g.addEventListener('scroll', syncBar, {passive:true});
  window.addEventListener('resize', syncBar);
  window.addEventListener('load', syncBar);
  syncBar();

  /* ---------- 03 카테고리 ---------- */
  var cl = document.getElementById('cats');
  (S.categories||[]).forEach(function(c){
    var ico = el('span',{class:'ico', 'aria-hidden':'true'});
    if (c.icon) ico.appendChild(el('img',{src:c.icon, alt:'', loading:'lazy'}));
    cl.appendChild(el('li', null, [
      ext(el('a',{href:c.url, 'aria-label': c.name + ' 바로가기'}, [
        ico,
        el('span',{class:'cname',text:c.name}),
        el('span',{class:'cgo',text:'바로가기'})
      ]))
    ]));
  });

  /* ---------- 하단: 고객센터 ---------- */
  var C = S.contact || {};
  var ac = document.getElementById('actions');
  var telIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
  if (C.phone) ac.appendChild(el('a',{href:'tel:' + C.phone.replace(/[^0-9+]/g,''), html: telIcon + '<span>고객센터 ' + C.phone + '</span>'}));
  var info = document.getElementById('info');
  info.innerHTML = C.hours ? '<b>고객센터</b> ' + C.hours : '';
})();
</script>
</body>
</html>
